name: Validate custom UI against upstream (PR)

on:
  pull_request:
    paths:
      - 'custom/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/admin-patch-pr-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout automation branch
        uses: actions/checkout@v4
        with:
          path: automation

      - name: Checkout upstream MoonTVPlus
        uses: actions/checkout@v4
        with:
          repository: mtvpls/MoonTVPlus
          ref: main
          fetch-depth: 0
          path: upstream

      - name: Test admin semantic adapter
        run: python3 -m unittest discover -s automation/tests -p 'test_admin_customization.py' -v

      - name: Apply and verify all custom patches
        shell: bash
        run: |
          set -euo pipefail
          bash automation/scripts/verify-patch.sh upstream automation/custom/custom-ui-v1.7.1.patch
          git -C upstream diff --cached --check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build PR smoke image (never push)
        uses: docker/build-push-action@v6
        with:
          context: ./upstream
          file: ./upstream/Dockerfile.preview
          platforms: linux/amd64
          load: true
          push: false
          tags: moontvplus-custom:pr-validation

      - name: Smoke test PR container
        run: bash automation/scripts/smoke-test.sh moontvplus-custom:pr-validation
